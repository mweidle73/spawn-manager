name: Release Integrity

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-integrity
  cancel-in-progress: true

jobs:
  verify-release-tags:
    name: Verify published release tags
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out canonical upstream
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release registry and annotated tags
        shell: bash
        run: |
          set -euo pipefail
          repository_tags=$(mktemp)
          selected_tags=$(mktemp)
          trap 'rm -f "$repository_tags" "$selected_tags"' EXIT

          git for-each-ref \
            --format='%(refname:strip=2)%09%(objectname)' refs/tags |
            LC_ALL=C sort > "$repository_tags"
          .github/ci/select-maintained-tags.sh \
            .github/maintained-release-tags \
            "$repository_tags" > "$selected_tags"

          verified=0
          while IFS=$'\t' read -r tag target tag_object; do
            .github/ci/verify-maintained-tag.sh \
              "$tag" "$target" "$tag_object"
            verified=$((verified + 1))
          done < "$selected_tags"

          {
            echo "## Release-tag integrity"
            echo
            echo "Verified annotated release tags: $verified"
          } >> "$GITHUB_STEP_SUMMARY"
