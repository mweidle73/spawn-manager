name: Documentation Pages

on:
  push:
    branches:
      - abuild-gh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  documentation:
    name: Build documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out Spawn Manager
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build the documentation
        shell: bash
        run: |
          .github/ci/run /bin/sh -c '
            set -eu
            test "$(id -u)" -ne 0
            make doc
          '

      - name: Verify the Pages tree
        shell: bash
        run: |
          set -euo pipefail
          test -s doc/html/index.html
          grep -Fq '<title>Ada Spawn Manager</title>' doc/html/index.html
          grep -Fq '<h1>Ada Spawn Manager</h1>' doc/html/index.html
          grep -Fq 'git.codelabs.ch/git/spawn-manager.git' \
            doc/html/index.html
          test -z "$(find doc/html -type l -print -quit)"

      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: doc/html/
          retention-days: 7

  deploy-pages:
    name: Deploy GitHub Pages
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy the documentation site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
