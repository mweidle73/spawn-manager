name: Documentation Pages

on:
  push:
    branches:
      - abuild-gh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  documentation:
    name: Build documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out Spawn Manager
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the documentation
        shell: bash
        run: |
          .github/ci/run /bin/sh -c '
            set -eu
            test "$(id -u)" -ne 0
            make doc
          '

      - name: Verify the Pages tree
        shell: bash
        run: |
          set -euo pipefail
          test -s doc/html/index.html
          test -s doc/html/CHANGELOG.html
          test -s doc/html/protocol-v1.html
          test -s doc/html/lifecycle-v1.html
          test -s doc/html/styles.css
          grep -Fq '<title>Ada Spawn Manager</title>' doc/html/index.html
          grep -Fq '<h1 id="ada-spawn-manager">Ada Spawn Manager</h1>' \
            doc/html/index.html
          grep -Fq 'git.codelabs.ch/?p=spawn-manager.git' doc/html/index.html
          grep -Fq '<h1 id="changelog">Changelog</h1>' \
            doc/html/CHANGELOG.html
          grep -Fq '<h1 id="spawn-manager-protocol-version-1">' \
            doc/html/protocol-v1.html
          grep -Fq '<h1 id="spawn-manager-lifecycle-version-1">' \
            doc/html/lifecycle-v1.html
          if grep -R -E 'href="[^"]+\.md' doc/html/*.html; then
            echo 'Generated documentation contains a Markdown link' >&2
            exit 1
          fi
          test -z "$(find doc/html -type l -print -quit)"

      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: doc/html/
          retention-days: 7

  deploy-pages:
    name: Deploy GitHub Pages
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy the documentation site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
