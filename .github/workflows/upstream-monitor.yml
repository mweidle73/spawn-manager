# Safely fast-forward the GitHub mirror from its authoritative upstream.
name: Upstream Monitor

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-monitor
  cancel-in-progress: true

jobs:
  sync-upstream:
    name: Synchronize Codelabs master
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the GitHub master mirror
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Fast-forward branch and synchronize release tags
        shell: bash
        run: |
          set -euo pipefail
          upstream_url=https://git.codelabs.ch/git/spawn-manager.git
          upstream_branch=master
          upstream_ref="refs/remotes/upstream/$upstream_branch"

          git fetch --no-tags "$upstream_url" "refs/heads/$upstream_branch:$upstream_ref"

          mirror_sha=$(git rev-parse HEAD)
          upstream_sha=$(git rev-parse "$upstream_ref")
          read -r mirror_only upstream_only <<EOF
          $(git rev-list --left-right --count "HEAD...$upstream_ref")
          EOF

          mirror_tags=$(mktemp)
          upstream_tags=$(mktemp)
          trap 'rm -f "$mirror_tags" "$upstream_tags"' EXIT
          list_release_tags() {
            git ls-remote --tags "$1" |
              awk '$2 !~ /\^\{\}$/ {
                name = $2
                sub("^refs/tags/", "", name)
                if (1) print name "\t" $1
              }' |
              LC_ALL=C sort
          }
          list_release_tags origin > "$mirror_tags"
          list_release_tags "$upstream_url" > "$upstream_tags"

          tag_refspecs=()
          tag_conflict=
          while IFS=$'\t' read -r tag upstream_tag_sha; do
            test -n "$tag" || continue
            mirror_tag_sha=$(awk -F '\t' -v wanted="$tag" '$1 == wanted { print $2 }' "$mirror_tags")
            if test -z "$mirror_tag_sha"; then
              if git fetch --no-tags "$upstream_url" "refs/tags/$tag:refs/tags/$tag"; then
                tag_refspecs+=("refs/tags/$tag:refs/tags/$tag")
              else
                tag_conflict="could not fetch upstream tag $tag"
                break
              fi
            elif test "$mirror_tag_sha" != "$upstream_tag_sha"; then
              tag_conflict="tag $tag points at different objects"
              break
            fi
          done < "$upstream_tags"

          mirror_only_tag=
          while IFS=$'\t' read -r tag mirror_tag_sha; do
            test -n "$tag" || continue
            upstream_tag_sha=$(awk -F '\t' -v wanted="$tag" '$1 == wanted { print $2 }' "$upstream_tags")
            if test -z "$upstream_tag_sha"; then
              mirror_only_tag=$tag
              break
            fi
          done < "$mirror_tags"

          tag_count_before=$(wc -l < "$mirror_tags" | tr -d ' ')
          upstream_tag_count=$(wc -l < "$upstream_tags" | tr -d ' ')
          tag_add_count=${#tag_refspecs[@]}
          final_mirror_sha=$mirror_sha
          tags_match='not checked'
          sync_status=pending

          write_summary() {
            {
              echo '## Automatic upstream synchronization'
              echo
              echo '| Ref | Commit |'
              echo '| --- | --- |'
              echo "| GitHub \`master\` before sync | \`$mirror_sha\` |"
              echo "| Upstream \`$upstream_branch\` | \`$upstream_sha\` |"
              echo "| GitHub \`master\` after sync | \`$final_mirror_sha\` |"
              echo
              echo "Mirror-only commits: $mirror_only"
              echo
              echo "Upstream-only commits: $upstream_only"
              echo
              echo "Release tags before sync: $tag_count_before"
              echo
              echo "Release tags upstream: $upstream_tag_count"
              echo
              echo "Release tags selected for addition: $tag_add_count"
              echo
              echo "Release-tag refs match after sync: $tags_match"
              echo
              echo "Result: $sync_status"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if test "$mirror_only" -ne 0; then
            sync_status='blocked: GitHub master contains mirror-only commits'
            write_summary
            echo "$sync_status" >&2
            exit 1
          fi
          if test -n "$tag_conflict"; then
            sync_status="blocked: $tag_conflict"
            write_summary
            echo "$sync_status" >&2
            exit 1
          fi
          if test -n "$mirror_only_tag"; then
            sync_status="blocked: release tag $mirror_only_tag exists only on GitHub"
            write_summary
            echo "$sync_status" >&2
            exit 1
          fi

          push_refspecs=("$upstream_ref:refs/heads/master")
          push_refspecs+=("${tag_refspecs[@]}")
          if ! git push --atomic origin "${push_refspecs[@]}"; then
            sync_status='failed: GitHub rejected the atomic fast-forward push'
            write_summary
            echo "$sync_status" >&2
            exit 1
          fi

          final_mirror_sha=$(
            git ls-remote origin refs/heads/master | cut -f1
          )
          list_release_tags origin > "$mirror_tags"
          tags_match=true
          if ! diff -u "$mirror_tags" "$upstream_tags"; then
            tags_match=false
          fi

          if test "$final_mirror_sha" != "$upstream_sha" || test "$tags_match" != true; then
            sync_status='failed: post-push verification differs from upstream'
            write_summary
            echo "$sync_status" >&2
            exit 1
          fi

          if test "$upstream_only" -eq 0 && test "$tag_add_count" -eq 0; then
            sync_status='already up to date'
          else
            sync_status="updated: $upstream_only commits and $tag_add_count release tags"
          fi
          write_summary
          echo "$sync_status"
