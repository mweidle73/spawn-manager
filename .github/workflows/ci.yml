name: Trixie CI

on:
  push:
    branches:
      - master
      - abuild-gh
  pull_request:
    branches:
      - master
      - abuild-gh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trixie-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Spawn Manager
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify maintained release-tag policy
        shell: bash
        run: .github/ci/test-maintained-tags.sh

      - name: Build Spawn Manager and run its unit tests
        shell: bash
        run: |
          .github/ci/run /bin/sh -c '
            set -eu
            test "$(id -u)" -ne 0
            make clean
            make -j8
            make tests
          '
